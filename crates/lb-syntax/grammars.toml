# grammars.toml — embedded language registry
# Each entry maps a language key to its file extensions, tree-sitter C symbol,
# and optional shebangs. Grammar .so/.dll/.dylib files live in
# ~/.local/share/luckybird/grammars/<lang>.<ext>

[rust]
extensions = ["rs"]
grammar_fn = "tree_sitter_rust"
shebangs   = []

[python]
extensions = ["py", "pyi"]
grammar_fn = "tree_sitter_python"
shebangs   = ["python", "python3"]

[javascript]
extensions = ["js", "mjs", "cjs"]
grammar_fn = "tree_sitter_javascript"
shebangs   = ["node"]

[typescript]
extensions = ["ts", "mts", "cts"]
grammar_fn = "tree_sitter_typescript"
shebangs   = []

[tsx]
extensions = ["tsx"]
grammar_fn = "tree_sitter_tsx"
shebangs   = []

[go]
extensions = ["go"]
grammar_fn = "tree_sitter_go"
shebangs   = []

[c]
extensions = ["c", "h"]
grammar_fn = "tree_sitter_c"
shebangs   = []

[cpp]
